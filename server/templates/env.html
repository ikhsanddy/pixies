<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8"/>
    <meta name="viewport" content="width=device-width"/>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23232835'/%3E%3Cpath d='M15 63H33L45 23L59 77L69 52' fill='none' stroke='%2335E0A0' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='66' y='34' width='16' height='16' rx='6' fill='%2335E0A0'/%3E%3Crect x='78' y='19' width='9' height='9' rx='3' fill='%2335E0A0'/%3E%3C/svg%3E" type="image/svg+xml"/>
    <title>Pixies [Dev Mode]</title>
    <style type="text/css">
        body, html {
            font-family: sans-serif;
            color: #FEFEFE;
            background-color: #232835;
            padding: 0;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            gap: 1rem;
        }

        .logo {
            display: flex;
            gap: 1rem;
            align-items: center;
            user-select: none;
        }

        .logo svg {
            width: 2.5rem;
            height: 2.5rem;
        }

        .logo span {
            color: #3EA95A;
        }

        code {
            background-color: #1d2128;
            padding: 0.5rem;
            border-radius: 0.4rem;
        }

        p {
            margin: 0.5rem;
            font-size: 16pt;
        }

        button {
            background-color: #3EA95A;
            border: none;
            border-radius: 0.4rem;
            padding: 0.5rem 1rem;
            color: #1d2128;
            font-weight: bold;
            font-size: 13pt;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: rotate(-1deg);
        }

        button:active {
            transform: scale(0.95);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="40" height="40" role="img" aria-label="Pixies">
        <path d="M15 63H33L45 23L59 77L69 52" fill="none" stroke="#35E0A0" stroke-width="10"
              stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="66" y="34" width="16" height="16" rx="6" fill="#35E0A0"/>
        <rect x="78" y="19" width="9" height="9" rx="3" fill="#35E0A0"/>
    </svg>
    <h1>Pixies <span>Dev Mode</span></h1>
</div>

<div class="explanation">
    <p>Your Pixies instance is currently in development mode.</p>
    <p>Please build the client or use a production binary,</p>
    <p>if this is a production environment or go to the development</p>
    <p>environment.</p>
</div>

<button onclick="window.location.href = 'http://localhost:5173';" class="hidden">Go to development environment</button>

</body>
<script type="text/javascript">
    fetch("http://localhost:5173").then(res => {
        if (res.status === 200)
            document.querySelector("button").classList.remove("hidden");
    }).catch(err => {
        console.error(err);
    });
</script>
</html>
